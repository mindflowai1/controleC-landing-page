<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CONTROLE-C - Nossa nova landing page estará no ar em breve. Inscreva-se para receber atualizações.">
    <title>CONTROLE-C | Em Breve</title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Link to Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-decorations">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <main class="main-container">
        <div class="card" id="main-card">
            <!-- Brand Badge -->
            <div class="brand-badge">
                <span class="pulse-dot"></span>
                <span>EM DESENVOLVIMENTO</span>
            </div>

            <!-- Big Title -->
            <h1 class="main-title" id="brand-title">CONTROLE-C</h1>

            <!-- Subtitle/Notice -->
            <p class="description">
                Estamos construindo algo extraordinário. A nossa landing page oficial estará no ar muito em breve.
            </p>

            <!-- Interaction Form (Premium addition to avoid simple MVP) -->
            <form class="subscription-form" id="newsletter-form">
                <div class="input-group">
                    <input 
                        type="email" 
                        id="email-input" 
                        placeholder="Seu melhor e-mail" 
                        required 
                        aria-label="Endereço de e-mail"
                        autocomplete="email"
                    >
                    <button type="submit" id="submit-btn">
                        <span>Notificar-me</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Toast / Success Message container -->
            <div class="toast-message" id="toast-success" aria-live="polite">
                <div class="toast-content">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="check-icon">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Pronto! Enviaremos um alerta assim que lançarmos.</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p id="footer-text">&copy; <span id="current-year"></span> CONTROLE-C. Todos os direitos reservados.</p>
    </footer>

    <!-- Form Interaction Script -->
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const form = document.getElementById('newsletter-form');
        const toast = document.getElementById('toast-success');
        const emailInput = document.getElementById('email-input');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Premium micro-interaction behavior
            submitBtn.classList.add('loading');
            
            setTimeout(() => {
                submitBtn.classList.remove('loading');
                form.style.display = 'none';
                toast.classList.add('show');
            }, 1000);
        });
    </script>
</body>
</html>
